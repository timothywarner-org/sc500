#cloud-config
# Synthetic Contoso listener for the SC-500 Lesson 6 lab. It answers every HTTP GET on the
# listed ports with one line that names the service and the address the request arrived from.
# That second part is the point in demo 6.2: behind a Private Link service, the provider sees
# the NAT IP, never the partner's own address. No packages are downloaded, because the lab
# subnets have no default outbound internet access. The templates replace __ROLE__ and
# __PORTS__ (a space-separated list, for example "8080").
write_files:
  - path: /usr/local/lib/contoso/listen.py
    permissions: '0755'
    content: |
      #!/usr/bin/python3
      """Answer GET on every port given on the command line with the role and the peer address."""
      import http.server, sys, threading
      ROLE = "__ROLE__"
      class Handler(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              body = f"Contoso {ROLE} (synthetic lab fixture). Request arrived from {self.client_address[0]}.\n".encode()
              self.send_response(200)
              self.send_header("Content-Type", "text/plain")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)
          def log_message(self, fmt, *args):
              pass
      servers = [http.server.ThreadingHTTPServer(("0.0.0.0", int(p)), Handler) for p in sys.argv[1:]]
      for s in servers[1:]:
          threading.Thread(target=s.serve_forever, daemon=True).start()
      servers[0].serve_forever()
  - path: /etc/systemd/system/contoso-listener.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Contoso __ROLE__ test listener
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 /usr/local/lib/contoso/listen.py __PORTS__
      Restart=always
      DynamicUser=yes
      NoNewPrivileges=yes

      [Install]
      WantedBy=multi-user.target
runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, contoso-listener.service]
